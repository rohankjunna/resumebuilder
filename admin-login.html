<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login | Dossier</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-page="auth">
<script>if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');document.documentElement.style.background='#0f0a1a';}</script>
<header class="topbar">
  <a class="brand" href="/">Dossier <small>resume workshop</small></a>
</header>
<main class="auth-wrap">
  <form class="auth-card" id="adminLoginForm">
    <h1>Admin access.</h1>
    <p>This area is restricted to site administrators only.</p>
    <div class="field">
      <label for="email">EMAIL</label>
      <input id="email" name="email" type="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">PASSWORD</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>
    <div class="form-message" role="alert"></div>
    <button class="btn green" type="submit">Sign in as admin</button>
    <div class="switch">User login? <a href="/login">Go to normal login</a></div>
    <div class="switch"><a href="/">← Back to home</a></div>
  </form>
</main>
<script>
document.getElementById('adminLoginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = e.target.querySelector('.form-message');
  const btn = e.target.querySelector('button');
  msg.textContent = '';
  btn.disabled = true;
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    })
  });
  const data = await res.json();
  if (res.ok) {
    window.location.href = '/admin';
  } else {
    msg.style.color = '#e53e3e';
    msg.textContent = data.error || 'Login failed.';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
