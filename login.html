<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Log in | Dossier</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body data-page="auth">
        <script>if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');document.documentElement.style.background='#0f0a1a';}

        </script>
        <header class="topbar">
            <a class="brand" href="/">Dossier
                 <small>resume workshop</small>
                </a><div class="auth-links">
                    <a class="btn light" href="/about">About us</a>
                    <a class="btn light" href="/contact">Contact</a>
                </div>
            </header>
            <main class="auth-wrap">
                    <form class="auth-card" id="loginForm">
                        <h1>Welcome back.</h1>
                        <p>Sign in to return to your workspace.</p>
                        <div class="field">
                            <label for="email">EMAIL</label>
                            <input id="email" name="email" type="email" required></div>
                            <div class="field">
                                <label for="password">PASSWORD</label>
                                <input id="password" name="password" type="password" minlength="8" required></div>
                                <div class="form-message" role="alert"></div>
                                <button class="btn green" type="submit">Log in</button>
                                <div class="switch">New here? 
                                    <a href="/signup">Create an account</a>
                                </div>
                                <div class="switch">Admin access?
                                     <a href="/admin/login">Sign in as admin</a>
                                    </div>
                            <div class="switch">
                                <a href="/">← Back to home</a>
                            </div>
                        </form>
                    </main>
                    <script src="/static/app.js">

                    </script>
                    </body>
                    </html>
