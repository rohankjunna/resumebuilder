<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Contact | Dossier</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body data-page="contact">
        <script>
            if(localStorage.getItem('theme')==='dark') {
                document.body.classList.add('dark');
            }
        </script>
        <header class="topbar">
            <a class="brand" href="/">Dossier <small>resume workshop</small></a>
            <nav class="nav">
                <a data-page="home" href="/">🏠 Dashboard</a>
                <a data-page="about" href="/about">💡 About us</a>
                <a data-page="contact" href="/contact">📬 Contact</a>
            </nav>
            <div class="auth-links">
                <a class="btn light" href="/login">Log in</a>
                <a class="btn" href="/signup">Sign up</a>
            </div>
            <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
        </header>
        <main>
            <section class="page-intro">
                <span class="eyebrow">Contact</span>
                <h1>Let’s talk it through.</h1>
                <p class="muted">Questions, feedback, or a thoughtful complaint are all welcome.</p>
            </section>
            <div class="content-grid">
                <form class="contact-form" id="contactForm">
                    <div class="field">
                        <label for="name">NAME</label>
                        <input id="name" required>
                    </div>
                    <div class="field">
                        <label for="email">EMAIL</label>
                        <input id="email" type="email" required>
                    </div>
                    <div class="field">
                        <label for="message">MESSAGE</label>
                        <textarea id="message" required></textarea>
                    </div>
                    <div class("form-message") role("status")></div>
                    <button class("btn green") type("submit")>Send message</button>
                </form>
                <div>
                    <h2 class("section-title")>A human inbox.</h2>
                    <p class("muted")>We read every note. For account access, include the email address attached to your Dossier account.</p>
                </div>
            </div>
        </main>
        <script src="/static/app.js"></script>
    </body>
</html>
